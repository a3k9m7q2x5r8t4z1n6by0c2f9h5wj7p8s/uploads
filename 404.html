<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
}

.container {
    max-width: 700px;
    margin: 80px auto;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 120px;
    margin: 0;
    color: #7c3aed; /* بنفسجي */
}

h2 {
    margin-top: 0;
    font-size: 32px;
}

.box {
    background: #fff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
    margin-top: 20px;
}

.footer {
    margin-top: 30px;
    color: #777;
    font-size: 14px;
}
</style>
</head>
<body>

<div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>

    <div class="box">
        <p>The page you requested could not be found.</p>
        <p>Please check the URL or return to the homepage.</p>
    </div>

</div>

</body>
</html>
